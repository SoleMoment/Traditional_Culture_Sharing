<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>中国优秀传统文化分享会 · 登录</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/loading.css" />
    <style>
      .auth-hero {
        background: linear-gradient(145deg, #8B4513 0%, #D2691E 50%, #CD853F 100%);
      }
      .auth-hero::before {
        background: radial-gradient(circle at 30% 20%, rgba(255,215,0,0.2) 0%, transparent 50%),
                    radial-gradient(circle at 70% 80%, rgba(139,69,19,0.3) 0%, transparent 50%);
      }
      .tradition-pattern {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 120px;
        background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 L35 25 L55 30 L35 35 L30 55 L25 35 L5 30 L25 25 Z' fill='rgba(255,215,0,0.1)'/%3E%3C/svg%3E") repeat;
        opacity: 0.5;
      }
      #loginSubmit,
      #loginSubmit:hover,
      #loginSubmit:active {
        transition: none !important;
        animation: none !important;
        transform: none !important;
      }
      #loginSubmit::before {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <div class="auth-layout">
        <div class="auth-top">
          <div class="brand" style="background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%); -webkit-background-clip: text;">🏮 中国优秀传统文化分享会</div>
          <span class="muted">校内局域网 · 传承文化 · 分享经典</span>
        </div>

        <section class="auth-grid">
          <article class="auth-hero">
            <div style="position: relative; z-index: 1;">
              <div style="font-size: 3rem; margin-bottom: 1rem;">🏮</div>
              <h1>传承千年文化<br>分享经典之美</h1>
              <p>欢迎来到中国优秀传统文化分享会！在这里，你将通过数字化的方式，与同学们一起探索、分享和传承中华优秀传统文化的魅力。</p>
              <ul>
                <li>📧 邮件分享：用传统书信礼仪传递文化心得</li>
                <li>💬 即时交流：实时探讨传统文化话题</li>
                <li>🎨 作品展示：展示你的传统文化创作与发现</li>
              </ul>
              <p class="auth-note">教师机启动后，学生机访问：<code>http://教师机IP:3000</code></p>
            </div>
            <div class="tradition-pattern"></div>
          </article>

          <section class="auth-panel">
            <div style="text-align: center; margin-bottom: 1.5rem;">
              <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 2.5rem; box-shadow: 0 4px 15px rgba(139,69,19,0.3);">🏮</div>
              <h2>欢迎参加分享会</h2>
              <p class="muted">使用姓名登录，开启文化之旅</p>
            </div>
            <form id="loginForm">
              <div class="form-group">
                <label>姓名（中文姓名或拼音）</label>
                <input name="name" autocomplete="name" placeholder="例如：张三 或 zhangsan" required />
                <p class="muted" style="font-size: 0.8125rem; margin-top: 0.25rem;">可使用中文姓名或拼音邮箱前缀登录</p>
              </div>
              <div class="form-group">
                <label>密码</label>
                <input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
              </div>
              <button id="loginSubmit" class="btn btn-lg" type="submit" style="width: 100%; margin-top: 0.5rem; background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);">
                <span>进入分享会</span>
                <span style="margin-left: 0.5rem;">→</span>
              </button>
              <p id="loginErr" class="err"></p>
            </form>
            <p class="auth-foot">
              还没有账号？<a href="/register.html" style="color: #D2691E;">立即注册</a>
            </p>
          </section>
        </section>
      </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/ui.js"></script>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const submitBtn = e.target.querySelector('button[type="submit"]');

        document.getElementById('loginErr').textContent = '';

        try {
          await api('/api/login', {
            method: 'POST',
            body: JSON.stringify({
              name: fd.get('name'),
              password: fd.get('password'),
            }),
          });
          window.location.href = '/dashboard.html';
        } catch (err) {
          document.getElementById('loginErr').textContent = err.message;
        }
      });
      getMe().then((u) => {
        if (u) window.location.href = '/dashboard.html';
      });
    </script>
  </body>
</html>
